<!-- ===================== CSS ===================== -->
<style>
:root{--bg:#f2f5f7;--cd:#fff;--tx:#12202e;--mu:#5d6b79;--bd:#d9e0e6;--ac:#0f6f7c;--on:#fff;--soft:#e3f1f3;--bad:#b3261e;
--R:#c2562b;--I:#2a6fb8;--A:#a63d8f;--S:#2f8a56;--E:#c18a10;--C:#5f6b7a;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e161e;--cd:#16212c;--tx:#e6edf3;--mu:#97a6b4;--bd:#273543;--ac:#4fc1cf;--on:#06222a;--soft:#17323a;--bad:#ff8a80;--R:#ee8a5e;--I:#6fa8f0;--A:#d77fc4;--S:#5fc58a;--E:#e5b84a;--C:#9aa6b5}}
:root[data-theme="dark"]{--bg:#0e161e;--cd:#16212c;--tx:#e6edf3;--mu:#97a6b4;--bd:#273543;--ac:#4fc1cf;--on:#06222a;--soft:#17323a;--bad:#ff8a80;--R:#ee8a5e;--I:#6fa8f0;--A:#d77fc4;--S:#5fc58a;--E:#e5b84a;--C:#9aa6b5}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{font-family:"Iowan Old Style",Georgia,"Times New Roman",serif;line-height:1.2;margin:0 0 .5rem}
main{max-width:820px;margin:0 auto;padding:20px 16px 56px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:10px 0;z-index:5}
.pg{height:8px;background:var(--bd);border-radius:9px;overflow:hidden}
.pg i{display:block;height:100%;background:var(--ac);transition:width .25s}
.meta{display:flex;justify-content:space-between;font-size:.85rem;color:var(--mu);margin-top:6px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:18px;margin:12px 0}
.hero{display:grid;gap:18px;grid-template-columns:1fr;align-items:center}
@media(min-width:640px){.hero{grid-template-columns:1.2fr 1fr}}
.hero h1{font-size:clamp(1.8rem,5vw,2.6rem)}
.lead{color:var(--mu)}
.btn{font:inherit;font-weight:600;border:0;border-radius:10px;padding:11px 20px;background:var(--ac);color:var(--on);cursor:pointer}
.btn.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.btn:focus-visible,.ch button:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.it{display:grid;grid-template-columns:2.2em 1fr;gap:4px 8px;padding:12px 0;border-bottom:1px solid var(--bd)}
.it:last-child{border:0}
.it .n{color:var(--mu);text-align:right}
.it.miss{background:color-mix(in srgb,var(--bad) 10%,transparent);outline:2px solid var(--bad);border-radius:8px}
.ch{grid-column:2;display:flex;gap:8px;flex-wrap:wrap}
.ch button{font:inherit;min-width:64px;padding:8px 14px;border-radius:9px;border:1px solid var(--bd);background:var(--cd);color:var(--tx);cursor:pointer}
.ch button.on{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:600}
.ch.se button{min-width:42px;padding:8px 0;flex:1}
.err{color:var(--bad);font-weight:600;min-height:1.4em;margin-top:10px}
.bars div{display:grid;grid-template-columns:7.5em 1fr 3em;gap:10px;align-items:center;margin:8px 0;font-size:.95rem}
.bars b{display:block;height:14px;border-radius:7px}
.bars span{height:14px;background:var(--bd);border-radius:7px;overflow:hidden}
.code{font:700 clamp(2.6rem,9vw,4rem)/1 Georgia,serif;letter-spacing:.12em}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tags span{background:var(--soft);border-radius:20px;padding:3px 11px;font-size:.88rem}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:7px 6px;border-bottom:1px solid var(--bd);text-align:center}
th:first-child,td:first-child{text-align:left}
.sc{overflow-x:auto}
.note{font-size:.85rem;color:var(--mu)}
svg text{fill:var(--tx);font:600 14px system-ui,sans-serif}
@media print{.bar,.row,.noprint{display:none!important}body{background:#fff}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<main>

</main>

{t:'Pekerjaan',d:'Pilih “Ya” jika Anda tertarik pada pekerjaan berikut, dan “Tidak” jika tidak tertarik.',n:21,pre:'Saya ingin menjadi ',
m:'RIARRASRSSESSCECIERICECISEAESSICESRAARICCRRSASEACICESIEACEIIRRAECASIEIECCRRAAICIASRA',
x:`Pengawas bangunan|Ahli meteorologi|Pelukis, pemahat, atau pematung|Surveyor|Mekanik atau teknisi radio|Penulis lepas (freelance)|Penasihat orang dalam rehabilitasi|Petani, peternak, atau pekebun|Peneliti ilmu sosial|Guru SMA|Perancang undang-undang (legislator)|Penasihat masalah pribadi|Pekerja atau relawan sosial|Operator komputer|Manajer bandara|Akuntan publik|Dokter|Penjual properti|Teknisi elektronik|Ahli geologi|Auditor|Manajer penjualan|Teller bank|Ahli tumbuh-tumbuhan (botanis)|Ahli kenakalan anak atau remaja|Eksekutif bisnis|Seniman|Manajer stasiun televisi|Psikolog klinis|Guru IPS|Pekerja pada proyek riset sains|Ahli pajak|Eksekutif periklanan|Terapis bicara|Insinyur lokomotif|Pencipta lagu|Aktor atau aktris|Masinis|Fisikawan|Pemegang pembukuan|Penilai kredit|Montir mobil atau motor|Ahli pertukangan kayu|Konselor masalah pelecehan seksual|Pengaransemen musik|Penasihat karier|Manajer departemen store|Novelis atau cerpenis|Penaksir biaya|Peneliti sains atau penulis artikel ilmiah|Petugas akuntansi|Penjual (sales person)|Direktur atau manajer taman bermain|Ahli biologi|Perwakilan pabrik|Kartunis atau karikaturis|Penilai anggaran|Eksekutif humas|Sosiolog|Teknisi atau analis laboratorium medis|Mekanik atau teknisi pesawat terbang|Ahli kelistrikan|Penyair|Pembawa acara (MC)|Petugas inventory control|Penyanyi|Manajer perkemahan remaja|Astronom|Pemilik usaha sendiri|Antropolog|Usahawan|Pengawas kredit bank|Analis keuangan|Pilot helikopter|Pengemudi atau sopir|Penghibur (entertainer)|Musisi|Analis masalah lingkungan dan pencemaran|Juru bayar atau kasir|Ahli kimia|Penulis naskah drama atau skenario film|Konselor perkawinan atau keluarga|Juru las (welder)|Jurnalis, wartawan, atau reporter`.split('|')},
{t:'Estimasi Diri',d:'Nilai tingkat keterampilan Anda dibandingkan orang lain yang seusia, dari 1 (paling rendah) sampai 7 (paling tinggi).',n:12,se:1,
m:'ICRCAREESSIA',
x:`Matematis (berhitung, berlogika, berpikir sistematis)|Klerikal (pekerjaan kantor yang menuntut kehati-hatian, prosedural, dan teratur)|Mekanikal (memakai alat, mesin, atau perkakas mekanis)|Ofisial (mengarsip, membuat surat, laporan, kertas kerja)|Musikal (bermain musik, memahami nada, irama, instrumen)|Manual (bekerja langsung dengan tangan)|Manajerial (mengatur, memimpin, merencanakan, mengawasi orang lain)|Menjual (mempengaruhi, membujuk, meyakinkan orang lain)|Relasi interpersonal (memahami perasaan orang lain, berempati, menjalin hubungan)|Mengajar (menjelaskan dan membelajarkan sesuatu kepada orang lain)|Sains atau ilmiah (meneliti, survei, membuat hipotesis, menyimpulkan)|Artistik (membuat karya seni, melukis, memahat, menulis cerita atau artikel)`.split('|')}
];
const MAX=50, TOTAL=D.reduce((a,s)=>a+s.x.length,0);
let st=D.map(s=>Array(s.x.length).fill(null)), P=-1, pages=[];
D.forEach((s,i)=>{for(let o=0;o<s.x.length;o+=s.n)pages.push([i,o,Math.min(o+s.n,s.x.length)])});
const $=id=>document.getElementById(id);
const done=()=>st.reduce((a,s)=>a+s.filter(v=>v!==null).length,0);

function save(){try{localStorage.setItem('riasec',JSON.stringify({st,P}))}catch(e){}}
function load(){try{const j=JSON.parse(localStorage.getItem('riasec')||'null');if(j&&j.st&&j.st.length===D.length&&j.st.every((s,i)=>s.length===D[i].x.length)){st=j.st;P=j.P}}catch(e){}}

function hexagon(r,size){
  const c=size/2,R=size*0.34,pt=(i,k)=>{const a=-Math.PI/2+i*Math.PI/3;return[(c+Math.cos(a)*R*k).toFixed(1),(c+Math.sin(a)*R*k).toFixed(1)]};
  const ring=k=>[0,1,2,3,4,5].map(i=>pt(i,k).join(',')).join(' ');
  const poly=[...L].map((l,i)=>pt(i,Math.max(.04,r[l]/MAX)).join(',')).join(' ');
  let g=`<svg viewBox="0 0 ${size} ${size}" role="img" aria-label="Heksagon RIASEC" style="width:100%;max-width:${size}px;display:block;margin:auto">`;
  [.33,.66,1].forEach(k=>g+=`<polygon points="${ring(k)}" fill="none" stroke="var(--bd)" stroke-width="1.2"/>`);
  [...L].forEach((l,i)=>{const a=pt(i,1),b=pt(i,1.2);g+=`<line x1="${c}" y1="${c}" x2="${a[0]}" y2="${a[1]}" stroke="var(--bd)"/><text x="${b[0]}" y="${b[1]}" text-anchor="middle" dominant-baseline="middle" style="fill:var(--${l})">${l}</text>`});
  g+=`<polygon points="${poly}" fill="var(--ac)" fill-opacity=".25" stroke="var(--ac)" stroke-width="2.5" stroke-linejoin="round"/>`;
  [...L].forEach((l,i)=>{const p=pt(i,Math.max(.04,r[l]/MAX));g+=`<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="var(--${l})"/>`});
  return g+'</svg>';
}

function intro(){
  const saved=P>=0;
  $('app').innerHTML=`<section class="hero card"><div><h1>Tes Minat Karier RIASEC</h1>
  <p class="lead">Self Directed Search (SDS) berdasarkan teori kepribadian vokasional John Holland. Tes ini memetakan aktivitas, kompetensi, cita-cita pekerjaan, dan estimasi diri Anda ke enam tipe: Realistis, Investigatif, Artistik, Sosial, Enterprising, dan Konvensional.</p>
  <p class="lead">Terdiri dari ${TOTAL} butir dalam 4 bagian, sekitar 20 menit. Jawablah sesuai diri Anda, bukan sesuai yang Anda anggap ideal.</p>
  <div class="row"><button class="btn" id="go">${saved?'Lanjutkan tes':'Mulai tes'}</button>${saved?'<button class="btn g" id="rs">Mulai dari awal</button>':''}</div></div>
  ${hexagon({R:50,I:50,A:50,S:50,E:50,C:50},300)}</section>`;
  $('bar').hidden=true;
  $('go').onclick=()=>{if(P<0)P=0;draw()};
  if(saved)$('rs').onclick=()=>{st=D.map(s=>Array(s.x.length).fill(null));P=0;save();draw()};
}

function draw(){
  save();window.scrollTo(0,0);
  if(P<0)return intro();
  if(P>=pages.length)return result();
  const [si,a,b]=pages[P],s=D[si];
  $('bar').hidden=false;
  $('sec').textContent=`Bagian ${si+1}/4: ${s.t} (halaman ${P+1}/${pages.length})`;
  const upd=()=>{$('cnt').textContent=`${done()}/${TOTAL} terjawab`;$('pgi').style.width=done()/TOTAL*100+'%'};upd();
  let h=`<div class="card"><h2>${s.t}</h2><p class="lead">${s.d}</p>`;
  for(let i=a;i<b;i++){
    const v=st[si][i];
    h+=`<div class="it" data-i="${i}"><span class="n">${i+1}.</span><span>${s.pre||''}${s.x[i]}</span><div class="ch${s.se?' se':''}" role="group">`;
    if(s.se)for(let k=1;k<=7;k++)h+=`<button data-v="${k}" class="${v===k?'on':''}" aria-pressed="${v===k}">${k}</button>`;
    else h+=`<button data-v="1" class="${v===1?'on':''}" aria-pressed="${v===1}">Ya</button><button data-v="0" class="${v===0?'on':''}" aria-pressed="${v===0}">Tidak</button>`;
    h+='</div></div>';
  }
  h+=`<div class="err" id="err" role="alert"></div><div class="row"><button class="btn g" id="pv">Kembali</button><button class="btn" id="nx">${P===pages.length-1?'Lihat hasil':'Lanjut'}</button></div></div>`;
  $('app').innerHTML=h;
  $('app').onclick=e=>{
    const bt=e.target.closest('button[data-v]');if(!bt)return;
    const row=bt.closest('.it'),i=+row.dataset.i;
    st[si][i]=+bt.dataset.v;row.classList.remove('miss');
    row.querySelectorAll('button').forEach(x=>{const on=x===bt;x.classList.toggle('on',on);x.setAttribute('aria-pressed',on)});
    upd();save();$('err').textContent='';
  };
  $('pv').onclick=()=>{P--;draw()};
  $('nx').onclick=()=>{
    const miss=[];for(let i=a;i<b;i++)if(st[si][i]===null)miss.push(i);
    if(miss.length){
      document.querySelectorAll('.it').forEach(r=>r.classList.toggle('miss',miss.includes(+r.dataset.i)));
      $('err').textContent=`Masih ada ${miss.length} butir yang belum dijawab (ditandai merah).`;
      document.querySelector('.it.miss').scrollIntoView({block:'center',behavior:'smooth'});return;
    }
    P++;draw();
  };
}

function score(){
  const tot={R:0,I:0,A:0,S:0,E:0,C:0},per=[];
  D.forEach((s,si)=>{const q={R:0,I:0,A:0,S:0,E:0,C:0};
    [...s.m].forEach((c,i)=>{q[c]+=st[si][i]||0});
    per.push(q);for(const c in q)tot[c]+=q[c]});
  return{tot,per};
}

function result(){
  $('bar').hidden=true;
  const {tot,per}=score();
  const rank=[...L].sort((x,y)=>tot[y]-tot[x]||L.indexOf(x)-L.indexOf(y));
  const code=rank.slice(0,3).join('');
  let h=`<div class="card"><h1>Hasil Anda</h1><p class="lead">Kode Holland (tiga tipe tertinggi):</p>
  <div class="code">${[...code].map(c=>`<span style="color:var(--${c})">${c}</span>`).join('')}</div>
  <p class="lead">${rank.slice(0,3).map(c=>TP[c][0]).join(' – ')}</p></div>
  <div class="card"><h2>Profil minat</h2>${hexagon(tot,340)}<div class="bars" style="margin-top:12px">`;
  rank.forEach(c=>h+=`<div><span style="background:none"><i class="sw" style="background:var(--${c})"></i>${c} ${TP[c][0]}</span><span><b style="width:${tot[c]/MAX*100}%;background:var(--${c})"></b></span><strong>${tot[c]}</strong></div>`);
  h+=`</div><p class="note">Skor maksimum per tipe: ${MAX} (Aktivitas 11 + Kompetensi 11 + Pekerjaan 14 + Estimasi Diri 14).</p></div>`;
  rank.slice(0,3).forEach((c,i)=>h+=`<div class="card"><h3><i class="sw" style="background:var(--${c})"></i>${i+1}. ${TP[c][0]} (${c})</h3><p>${TP[c][1]}</p><div class="tags">${TP[c][2].split(', ').map(x=>`<span>${x}</span>`).join('')}</div></div>`);
  h+=`<div class="card sc"><h2>Rincian skor</h2><table><tr><th>Tipe</th>${D.map(s=>`<th>${s.t}</th>`).join('')}<th>Total</th></tr>`;
  [...L].forEach(c=>h+=`<tr><td>${c} ${TP[c][0]}</td>${per.map(q=>`<td>${q[c]}</td>`).join('')}<td><strong>${tot[c]}</strong></td></tr>`);
  h+=`</table></div><div class="row noprint"><button class="btn" onclick="window.print()">Cetak atau simpan PDF</button><button class="btn g" id="rt">Ulangi tes</button></div>`;
  $('app').innerHTML=h;
  $('rt').onclick=()=>{if(confirm('Hapus semua jawaban dan mulai ulang?')){st=D.map(s=>Array(s.x.length).fill(null));P=-1;try{localStorage.removeItem('riasec')}catch(e){}draw()}};
  try{localStorage.setItem('riasec',JSON.stringify({st,P}))}catch(e){}
}

load();
if(P>=pages.length)P=pages.length-1;
P<0?intro():intro();
</script>
</body>
</html>
